# iOS spike S1 (audio). `xcodegen generate` here, then see scripts/verify.sh.
name: SpikeAudio
options:
  bundleIdPrefix: app.encore.ios
  deploymentTarget:
    iOS: "17.0"
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2
targets:
  SpikeAudio:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: MPVKit
        product: MPVKit
    preBuildScripts:
      - name: Build Rust staticlib (spike-audio)
        script: '"$SRCROOT/../spike-audio/build.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Encore Spike
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.encore.ios.spike
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/SpikeAudio-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../spike-audio/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../spike-audio/out/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lspike_audio
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
