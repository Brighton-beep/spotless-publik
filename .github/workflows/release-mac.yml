# Builds, signs, notarizes and publishes the macOS release: Spotless-<version>.dmg (plus the stable
# Spotless.dmg the website links to) and the auto-update files (latest.json, the .app.tar.gz and
# its .sig) on the GitHub Release for the tag. It runs scripts/release-mac.sh, the same script
# used for local releases, so the two cannot drift apart.
#
# Start it by pushing a tag:  git tag -a v1.0.1 -m "Spotless 1.0.1" && git push origin v1.0.1
# or from the Actions tab (Release macOS > Run workflow) with a tag name. A dispatch for a tag
# that does not exist yet builds the chosen branch and creates the tag on it when publishing.
# The tag must equal "v" + the version in src-tauri/tauri.conf.json and Cargo.toml.
#
# Secrets (repository secrets; scripts/ci/setup-github-secrets.sh sets them all; see
# docs/RELEASING.md):
#   MACOS_CERTIFICATE            base64 of the "Developer ID Application" .p12 (cert + private key)
#   MACOS_CERTIFICATE_PASSWORD   that .p12's password
#   APPLE_API_KEY                base64 of the App Store Connect API key (.p8), for notarytool
#   APPLE_API_KEY_ID             its Key ID
#   APPLE_API_ISSUER_ID          its Issuer ID
#   TAURI_SIGNING_PRIVATE_KEY    the updater key file's contents (~/.tauri/spotless-updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   optional; only if that key has a password
#
# Release notes, first found wins: RELEASE_NOTES.md at the repo root if it mentions the version,
# the annotated tag's message, GitHub's generated notes. The same text goes into latest.json,
# which the in-app updater shows.
name: Release macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.1 (must match the app version)"
        required: true
        type: string

permissions:
  contents: write

# One release per tag at a time; never cancel a run that may be halfway through notarizing.
concurrency:
  group: release-mac-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    # Apple silicon, Xcode 16. The universal build cross-compiles the x86_64 half.
    runs-on: macos-15
    timeout-minutes: 150
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Outside the checkout, so nothing assumes the owner's ~/music-app/dist or ~/Library/Caches.
      # ENCORE_CACHE: where fetch-libmpv.sh keeps the IINA libmpv set (actions/cache below).
      - name: Paths
        run: |
          {
            echo "OUT=$RUNNER_TEMP/dist"
            echo "ENCORE_CACHE=$RUNNER_TEMP/encore-cache"
          } >> "$GITHUB_ENV"

      # Before anything slow: a run without every secret would only fail an hour in.
      - name: Check secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID \
                      APPLE_API_ISSUER_ID TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Run scripts/ci/setup-github-secrets.sh on the Mac that holds the Developer ID certificate (docs/RELEASING.md)."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Check out the tag (a dispatch may name one), fetch it as the annotated tag it is
      # (checkout can leave a lightweight copy, which loses the message), and hold the version
      # files to it.
      - name: Resolve tag and version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (expected v<major>.<minor>.<patch>[-pre])"; exit 1
          fi
          TARGET_SHA=""
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --quiet "refs/tags/$TAG"
          else
            # Dispatch for a new tag: build this commit; publishing creates the tag on it.
            TARGET_SHA="$(git rev-parse HEAD)"
            echo "Tag $TAG does not exist yet; it will be created on $TARGET_SHA"
          fi
          VERSION="${TAG#v}"
          CONF_VERSION="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' src-tauri/tauri.conf.json)"
          CARGO_VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          echo "tag $TAG  tauri.conf.json $CONF_VERSION  Cargo.toml $CARGO_VERSION"
          if [ "$CONF_VERSION" != "$VERSION" ] || [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match the app version (src-tauri/tauri.conf.json $CONF_VERSION, Cargo.toml $CARGO_VERSION). Bump both to $VERSION, commit, and tag that commit."
            exit 1
          fi
          PRERELEASE=false; [[ "$VERSION" == *-* ]] && PRERELEASE=true
          {
            echo "VERSION=$VERSION"
            echo "TARGET_SHA=$TARGET_SHA"
            echo "PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          if [ -f RELEASE_NOTES.md ] && grep -q -F "$VERSION" RELEASE_NOTES.md; then
            cp RELEASE_NOTES.md "$NOTES"; src="RELEASE_NOTES.md"
          elif [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null)" = tag ] \
            && [ -n "$(git tag -l --format='%(contents:body)' "$TAG" | tr -d '[:space:]')" ]; then
            git tag -l --format='%(contents:body)' "$TAG" > "$NOTES"; src="the tag message"
          else
            args=(-f "tag_name=$TAG")
            [ -n "$TARGET_SHA" ] && args+=(-f "target_commitish=$TARGET_SHA")
            if gh api "repos/$GH_REPO/releases/generate-notes" "${args[@]}" --jq .body > "$NOTES" 2>/dev/null \
              && [ -s "$NOTES" ]; then
              src="GitHub's generated notes"
            else
              echo "Spotless $VERSION" > "$NOTES"; src="a default line"
            fi
          fi
          echo "release notes from $src:"; cat "$NOTES"
          echo "NOTES_FILE=$NOTES" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Dependencies only (rust-cache drops the workspace's own crates), for both targets.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-mac
          cache-on-failure: false

      # The pnpm the lockfile was written with; ui/package.json has no packageManager field.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # The pinned IINA DMG and the dylib set fetch-libmpv.sh extracts from it (keyed on the script,
      # which pins the version and hash).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/encore-cache
          key: libmpv-iina-${{ hashFiles('scripts/macos/fetch-libmpv.sh') }}

      # A throwaway keychain holding only the Developer ID identity. Its password is random and
      # never leaves this job; the identity's SHA-1 becomes SIGN_IDENTITY, so it needs no secret.
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/spotless-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERT="$RUNNER_TEMP/developer-id.p12"
          (umask 077; printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERT")
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"
          # Apple's Developer ID intermediates (G2 for certificates from 2021 on, G1 before), in
          # case the .p12 carries only the leaf. Public certificates, fetched from Apple.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" >/dev/null 2>&1 || true
          done
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # This keychain first in the search list (codesign finds the identity there), and default.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN"
          IDS="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' || true)"
          if [ -z "$IDS" ]; then
            echo "::error::The .p12 in MACOS_CERTIFICATE holds no valid 'Developer ID Application' identity (expired, revoked, or the private key is missing). Re-run scripts/ci/setup-github-secrets.sh."
            security find-identity -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          [ "$(echo "$IDS" | wc -l)" -eq 1 ] || echo "::warning::several Developer ID identities in the .p12; using the first"
          SIGN_IDENTITY="$(echo "$IDS" | head -1 | awk '{print $2}')"
          echo "signing with $(echo "$IDS" | head -1 | sed 's/^ *[0-9]*) [0-9A-F]* //')"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      # Key files for notarytool and the updater signer, readable only by this user, removed in
      # the cleanup step.
      - name: Write key files
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEYS="$RUNNER_TEMP/keys"
          mkdir -p "$KEYS"; chmod 700 "$KEYS"
          (umask 077
           printf '%s' "$APPLE_API_KEY" | base64 --decode > "$KEYS/AuthKey_$APPLE_API_KEY_ID.p8"
           printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEYS/updater.key")
          grep -q 'BEGIN PRIVATE KEY' "$KEYS/AuthKey_$APPLE_API_KEY_ID.p8" \
            || { echo "::error::APPLE_API_KEY does not decode to a .p8 private key (it must be the base64 of the AuthKey_XXXX.p8 file)"; exit 1; }
          {
            echo "NOTARY_KEY_PATH=$KEYS/AuthKey_$APPLE_API_KEY_ID.p8"
            echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$KEYS/updater.key"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize (scripts/release-mac.sh)
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SPOTLESS_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.TAG }}
          # A Finder hiccup on the runner must not cost the release; make-dmg.sh warns instead.
          DMG_ALLOW_PLAIN: "1"
        run: scripts/release-mac.sh --arch universal --out "$OUT" --notes "$NOTES_FILE"

      - name: Verify the result
        run: |
          set -euo pipefail
          APP="$OUT/Spotless.app"
          DMG="$OUT/Spotless-$VERSION.dmg"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"
          xcrun stapler validate "$APP"
          lipo -archs "$APP/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")"
          python3 -I -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["version"]==sys.argv[2], d["version"]; print("latest.json:", d["version"], sorted(d["platforms"]))' "$OUT/latest.json" "$VERSION"

      # Also kept as a run artifact for a few days, for a look before or without the release.
      - uses: actions/upload-artifact@v4
        with:
          name: Spotless-${{ env.VERSION }}-macos
          path: |
            ${{ runner.temp }}/dist/*.dmg
            ${{ runner.temp }}/dist/*.app.tar.gz
            ${{ runner.temp }}/dist/*.sig
            ${{ runner.temp }}/dist/latest.json
          retention-days: 5
          compression-level: 0

      # Assets go up on a draft first and the release is published only once all of them are
      # there: installed apps fetch latest.json from the newest published release, and it must
      # never point at a tarball that is not uploaded yet. A re-run replaces the assets.
      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          ASSETS=(
            "$OUT/Spotless-$VERSION.dmg"
            "$OUT/Spotless.dmg"
            "$OUT/Spotless_${VERSION}_universal.app.tar.gz"
            "$OUT/Spotless_${VERSION}_universal.app.tar.gz.sig"
          )
          for f in "${ASSETS[@]}" "$OUT/latest.json"; do
            [ -s "$f" ] || { echo "::error::missing release asset $f"; exit 1; }
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing its assets"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release upload "$TAG" "$OUT/latest.json" --clobber
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            args=(--draft --title "Spotless $VERSION" --notes-file "$NOTES_FILE")
            [ "$PRERELEASE" = true ] && args+=(--prerelease)
            [ -n "$TARGET_SHA" ] && args+=(--target "$TARGET_SHA")
            gh release create "$TAG" "${args[@]}" "${ASSETS[@]}" "$OUT/latest.json"
            if [ "$PRERELEASE" = true ]; then
              gh release edit "$TAG" --draft=false
            else
              gh release edit "$TAG" --draft=false --latest
            fi
          fi
          echo "### Spotless $VERSION released" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain and keys
        if: always()
        run: |
          # Fixed paths, not $KEYCHAIN: the import step may have failed before exporting it.
          KEYCHAIN="$RUNNER_TEMP/spotless-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/developer-id.p12"
          echo "keychain and key files removed"
