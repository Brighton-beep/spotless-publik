name: android-libmpv

# libmpv (+ FFmpeg shared libs, librubberband, libc++_shared) for the Android app's jniLibs.
# Built here because mpv/FFmpeg cross-compile on Linux only. See android/libmpv/build.sh.

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - android/libmpv/**
      - .github/workflows/android-libmpv.yml

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm wget unzip
          sudo pip3 install --break-system-packages meson

      - name: Build libmpv for arm64-v8a
        shell: bash
        run: |
          set -o pipefail
          bash android/libmpv/build.sh work out 2>&1 | tee build.log

      # The tail of a failed build as an annotation: annotations are readable without signing in.
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 70 build.log | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=libmpv build failed::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-android-arm64-v8a
          path: out/
          if-no-files-found: error
