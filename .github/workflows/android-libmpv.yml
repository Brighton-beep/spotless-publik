name: android-libmpv

# libmpv (+ FFmpeg shared libs, librubberband, libc++_shared) for the Android app's jniLibs.
# Built here because mpv/FFmpeg cross-compile on Linux only. See android/libmpv/build.sh.

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - android/libmpv/**
      - .github/workflows/android-libmpv.yml

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm wget unzip
          sudo pip3 install --break-system-packages meson

      - name: Build libmpv for arm64-v8a
        run: bash android/libmpv/build.sh work out

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-android-arm64-v8a
          path: out/
          if-no-files-found: error
